databaseChangeLog:
  - changeSet:
      id: departement-1
      author: initial
      changes:
        - createTable:
            tableName: departements
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
  - changeSet:
      id: departement-2
      author: initial
      changes:
        - addColumn:
            tableName: employees
            columns:
              - column:
                  name: departement_id
                  type: BIGINT
        - addForeignKeyConstraint:
            constraintName: fk_employee_departement
            baseTableName: employees
            baseColumnNames: departement_id
            referencedTableName: departements
            referencedColumnNames: id
